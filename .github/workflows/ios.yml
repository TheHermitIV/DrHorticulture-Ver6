name: iOS

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    branches: [main]
    paths: ['ios/**']
  workflow_dispatch:

jobs:
  build:
    name: Build and unit test
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Build and run unit tests
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator $UDID"
          xcodebuild test \
            -project DrHorticulture.xcodeproj -scheme DrHorticulture \
            -destination "id=$UDID" \
            -only-testing:DrHorticultureTests \
            CODE_SIGNING_ALLOWED=NO

  testflight:
    name: Upload to TestFlight
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    env:
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Write App Store Connect key
        run: echo "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive
        run: |
          xcodebuild archive \
            -project DrHorticulture.xcodeproj -scheme DrHorticulture \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DrHorticulture.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export and upload
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>V7762TR96N</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DrHorticulture.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
