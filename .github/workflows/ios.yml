name: iOS

# Builds the app in ios/ and runs its unit tests on every iOS change; "Run workflow" on the
# Actions tab also archives it and uploads the build to TestFlight.
#
# TestFlight needs these repository settings (Settings -> Secrets and variables -> Actions):
#   secrets:   ASC_KEY_P8 (full .p8 text), ASC_KEY_ID, ASC_ISSUER_ID  (App Store Connect API key)
#   variables: APPLE_TEAM_ID, IOS_BUNDLE_ID  (override the project's team and bundle ID at build time)

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    branches: [main]
    paths: ['ios/**']
  workflow_dispatch:

jobs:
  build:
    name: Build and unit test
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      # UI tests are skipped: with the live API service they would send real scans to production.
      - name: Build and run unit tests
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator $UDID"
          xcodebuild test \
            -project DrHorticulture.xcodeproj -scheme DrHorticulture \
            -destination "id=$UDID" \
            -only-testing:DrHorticultureTests \
            CODE_SIGNING_ALLOWED=NO

  testflight:
    name: Upload to TestFlight
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    env:
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        run: |
          missing=0
          for name in ASC_KEY_P8 ASC_KEY_ID ASC_ISSUER_ID TEAM_ID BUNDLE_ID; do
            if [ -z "${!name}" ]; then echo "::error::$name is not set"; missing=1; fi
          done
          exit $missing

      - name: Write App Store Connect key
        run: echo "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"

      - name: Archive
        run: |
          xcodebuild archive \
            -project DrHorticulture.xcodeproj -scheme DrHorticulture \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DrHorticulture.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export and upload
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DrHorticulture.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
