name: iOS

# Builds the app in ios/ and runs its unit tests on every iOS change; "Run workflow" on the
# Actions tab also archives it and uploads the build to TestFlight.
#
# TestFlight needs these repository settings (Settings -> Secrets and variables -> Actions):
#   secrets:   ASC_KEY_P8 (.p8 text or base64), ASC_KEY_ID, ASC_ISSUER_ID  (App Store Connect API key)
#   variables: APPLE_TEAM_ID, IOS_BUNDLE_ID  (override the project's team and bundle ID at build time)

on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    branches: [main]
    paths: ['ios/**']
  workflow_dispatch:

jobs:
  build:
    name: Build and unit test
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      # UI tests are skipped: with the live API service they would send real scans to production.
      - name: Build and run unit tests
        run: |
          UDID=$(xcrun simctl list devices available -j \
            | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')
          echo "Using simulator $UDID"
          xcodebuild test \
            -project DrHorticulture.xcodeproj -scheme DrHorticulture \
            -destination "id=$UDID" \
            -only-testing:DrHorticultureTests \
            CODE_SIGNING_ALLOWED=NO

  testflight:
    name: Upload to TestFlight
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    env:
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - uses: actions/checkout@v4

      # Values pasted into the settings forms can carry stray spaces or line breaks, so the
      # single-line ones are trimmed here and exported for the later steps.
      - name: Check settings
        env:
          RAW_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          RAW_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          RAW_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          RAW_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
        run: |
          missing=0
          [ -n "$(printf '%s' "$ASC_KEY_P8" | tr -d '[:space:]')" ] \
            || { echo "::error::ASC_KEY_P8 is not set"; missing=1; }
          for name in ASC_KEY_ID ASC_ISSUER_ID TEAM_ID BUNDLE_ID; do
            raw="RAW_$name"
            value=$(printf '%s' "${!raw}" | tr -d '[:space:]')
            if [ -z "$value" ]; then echo "::error::$name is not set"; missing=1; fi
            case $name in ASC_*) [ -n "$value" ] && echo "::add-mask::$value" ;; esac
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          exit $missing

      # ASC_KEY_P8 may hold the .p8 text or the file as one base64 line (`base64 -w0 AuthKey.p8`),
      # which survives pasting into the secrets form.
      - name: Write App Store Connect key
        run: |
          key="$RUNNER_TEMP/AuthKey.p8"
          if printf '%s' "$ASC_KEY_P8" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' > "$key"
          else
            printf '%s' "$ASC_KEY_P8" | tr -d '\r\n ' | base64 --decode > "$key"
          fi
          if ! openssl pkey -in "$key" -noout 2>/dev/null; then
            echo "::error::ASC_KEY_P8 is not a valid .p8 key. Set it to the output of: base64 -w0 AuthKey_<KEY_ID>.p8"
            exit 1
          fi

      - name: Archive
        run: |
          xcodebuild archive \
            -project DrHorticulture.xcodeproj -scheme DrHorticulture \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DrHorticulture.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Export and upload
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DrHorticulture.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
