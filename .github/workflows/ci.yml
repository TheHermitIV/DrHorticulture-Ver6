name: CI

on:
  push:
    branches: [Backend, main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: api (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: Backend/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  plantvision:
    name: plantvision (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/plantvision
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Backend/plantvision/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: pytest

  inference:
    name: inference (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend/inference
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            Backend/inference/requirements*.txt
            Backend/plantvision/pyproject.toml
      # PlantVision's core only (no torch): the CV_ENGINE=plantvision tests use fake models.
      - run: python -m pip install -r requirements-dev.txt -e ../plantvision
      - run: pytest
